<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, 不能宅!</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1d1d1f;
    }

        --bg: #000000;
        --text: #f5f5f7;
      }
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
    }
    h1 {
      font-size: 3rem;

  <h1>Hello, 不能宅!</h1>

</html>
